<!doctype html>
<html lang="en">
<head>

<title>Rooftop Run — Tokyo Canyon</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;-webkit-user-select:none;user-select:none;
    font-family:"Avenir Next Condensed","Avenir Next","Futura","Helvetica Neue",Arial,sans-serif}
  canvas#c{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-style:italic;font-weight:800;letter-spacing:.03em}
  .chip{background:rgba(17,21,58,.88);transform:skewX(-10deg);border-radius:5px;box-shadow:4px 4px 0 #ffd60a;padding:6px 16px 6px 14px}
  .chip>span{display:flex;align-items:center;gap:10px;transform:skewX(10deg)}
  .lbl{font-size:11px;color:#ffd60a;letter-spacing:.14em;font-style:normal}
  #tl{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  #time{font-size:46px;line-height:1;font-variant-numeric:tabular-nums;min-width:108px;text-align:right}
  #timechip.low{box-shadow:4px 4px 0 #ff2d55;animation:pulse .5s infinite alternate}
  #timechip.low #time{color:#ff5470}
  @keyframes pulse{to{transform:skewX(-10deg) scale(1.06)}}
  #cpn{font-size:22px;font-variant-numeric:tabular-nums}
  #pips{display:flex;gap:5px}
  #pips i{width:11px;height:11px;transform:rotate(45deg);background:rgba(255,255,255,.22);border-radius:2px;transition:background .2s}
  #pips i.done{background:#3df5a4}
  #pips i.next{background:#ffd60a;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.35}}
  #reset{position:absolute;right:20px;top:16px;pointer-events:auto;cursor:pointer;border:0;color:#fff;font:inherit;font-size:15px;box-shadow:4px 4px 0 #ff2d8f}
  #reset:hover{background:#ff2d8f}
  kbd{font:inherit;font-style:normal;font-size:11px;background:#fff;color:#11153a;border-radius:4px;padding:1px 6px;box-shadow:0 2px 0 #9aa3c7}
  #keys{position:absolute;left:18px;bottom:16px;font-size:12px;padding:5px 12px;box-shadow:3px 3px 0 #29d3ff}
  #keys>span{gap:6px}
  #keys em{font-style:italic;opacity:.85;margin-right:8px}
  #toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-20px) skewX(-10deg) scale(.8);opacity:0;transition:all .18s cubic-bezier(.2,1.6,.4,1);
    background:#ffd60a;color:#11153a;padding:8px 26px;border-radius:6px;box-shadow:6px 6px 0 #11153a;text-align:center;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0) skewX(-10deg) scale(1)}
  #toast b{display:block;font-size:34px;line-height:1.1}
  #toast small{display:block;font-size:14px;letter-spacing:.08em}
  #toast.bad{background:#ff2d55;color:#fff}
  #toast.win{background:#3df5a4}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .35s}
  #flash.on{opacity:.9;transition:none}

  body.touch #touch{display:block} body.touch #keys{display:none}
  .tb{position:absolute;bottom:0;width:68px;height:68px;border-radius:18px;background:rgba(17,21,58,.6);border:3px solid rgba(255,255,255,.75);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal;pointer-events:auto;touch-action:none}
  .tb.on{background:#ffd60a;color:#11153a}

    #toast{top:24%;padding:6px 18px}#toast b{font-size:24px}#toast small{font-size:11px}#keys{font-size:11px;left:12px;bottom:12px}#pips i{width:9px;height:9px}}

<script type="module">
import * as THREE from 'three';

/* ───────────── utils ───────────── */

/* ───────────── sky, sun, clouds, Fuji ───────────── */
const sky = new THREE.Mesh(new THREE.SphereGeometry(2300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x1787ff) }, mid: { value: new THREE.Color(0x7fd2ff) }, bot: { value: new THREE.Color(0xfff0d8) } },
  vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',

}));
scene.add(sky);
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ctex(128, 128, g => { const r = g.createRadialGradient(64, 64, 4, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,250,210,.95)'); r.addColorStop(1, 'rgba(255,240,180,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); }),
  fog: false, depthWrite: false, transparent: true
}));
sunSprite.scale.set(520, 520, 1); scene.add(sunSprite);
{
  const ico = new THREE.IcosahedronGeometry(1, 1);
  const cm = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xc4daf2, emissiveIntensity: .6, fog: false, flatShading: true });

}

/* ───────────── far-field city (instanced, with window grids) ───────────── */
{

  });

}

/* ───────────── street: road, sakura, traffic, monorail ───────────── */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3200, 3200), M(0xb4bcc6)); ground.rotation.x = -PI / 2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);
{

  const zebra = ctex(128, 64, g => { g.fillStyle = '#fff'; for (let i = 0; i < 8; i++) g.fillRect(4 + i * 16, 0, 9, 64); });

    pd.position.y = c.h + .36; if (c.bus) pd.scale.set(0, 0, 0); else pd.scale.set(c.w * .88, .62, c.len * .5); pd.updateMatrix(); carTop.setMatrixAt(i, pd.matrix);
  }
  carBody.instanceMatrix.needsUpdate = carTop.instanceMatrix.needsUpdate = true;
  const tz = 60 - ((clock * 26) % 360); train.position.z = tz; train.children.forEach((m, i) => { const z = tz + i * 12; m.visible = z < 50 && z > -206; });
  for (const c of clouds) { c.position.x += dt * 3; if (c.position.x > 1400) c.position.x = -1400; }
  // particles
  for (let i = 0; i < PN; i++) {
    const p = parts[i]; if (p.life <= 0) continue; p.life -= dt;
    if (p.life <= 0) pd.scale.set(0, 0, 0);
    else { p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; const k = Math.pow(p.life / p.max, .6); pd.position.set(p.x, p.y, p.z); pd.rotation.set(p.spin * p.life, p.yaw + p.spin * p.life, 0); pd.scale.set(p.sx * k, p.sy * k, p.sz * (p.spin ? k : 1)); }
    pd.updateMatrix(); pMesh.setMatrixAt(i, pd.matrix);
  }
  pMesh.instanceMatrix.needsUpdate = true;
  // sun + sky follow the action
  sun.target.position.set(P.x, 40, P.z); sun.position.copy(sun.target.position).addScaledVector(SUN, 170);
  sky.position.copy(camera.position); sunSprite.position.copy(camera.position).addScaledVector(SUN, 2000);
}
function hud(dt) {
  const s = S.time.toFixed(1); if (s !== lastTime) { lastTime = s; elTime.textContent = s; elChip.classList.toggle('low', S.time <= 10 && S.mode !== 'win'); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) elToast.className = ''; }
}

/* ───────────── go — no menu, the run is already on ───────────── */
reset();
let last = performance.now(); const dbg = { pause: false };
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  readInput(); if (!dbg.pause) simulate(dt); animHero(dt); updateCamera(dt); animWorld(dt); hud(dt);
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__rooftop = { dbg, P, S, inp, keys, boxes, CPS, SPAWNS, simulate, reset, readInput, cam, camera, renderer, scene };
</script>
