<style>

  #ui button:hover{background:rgba(255,190,110,.2)}

  #ui input[type=range]{-webkit-appearance:none;appearance:none;width:64px;height:2px;background:rgba(255,196,128,.45);border-radius:2px;outline:none}
  #ui input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#ffc98a;border:1px solid #5a3a12;cursor:pointer}

function dec(b64) { const s = atob(b64), o = []; let i = 0; while (i < s.length) { let v = 0, sh = 0, b; do { b = s.charCodeAt(i++); v |= (b & 127) << sh; sh += 7; } while (b & 128); o.push((v >>> 1) ^ -(v & 1)); } return o; }
function decPolys(b64, flagged) { const a = dec(b64), out = []; let k = 1; for (let n = 0; n < a[0]; n++) { const m = a[k++], fl = flagged ? a[k++] : 0, p = []; let x = 0, z = 0; for (let i = 0; i < m; i++) { x += a[k++]; z += a[k++]; p.push([x, z]); } p.flag = fl; out.push(p); } return out; }
const G = {};
function decodeGeo() {
  G.coast = decPolys(GEO.coast); G.tram = decPolys(GEO.tram); G.ptram = decPolys(GEO.ptram)[0]; G.cable = decPolys(GEO.cable)[0];
  G.lakes = decPolys(GEO.lakes); G.dams = decPolys(GEO.dams); G.breakwaters = decPolys(GEO.breakwaters); G.beaches = decPolys(GEO.beaches); G.cemeteries = decPolys(GEO.cemeteries); G.parks = decPolys(GEO.parks); G.piers = decPolys(GEO.piers, true);
  G.trails = GEO.trails ? decPolys(GEO.trails) : []; G.catch = GEO.catchwaters ? decPolys(GEO.catchwaters) : []; G.esc = GEO.escalator ? decPolys(GEO.escalator)[0] : null;
  const pk = dec(GEO.peaks); G.peaks = []; for (let i = 0; i < pk[0]; i++) G.peaks.push([pk[1 + i * 3], pk[2 + i * 3], pk[3 + i * 3]]);
  const d = dec(GEO.dem); let v = 0; G.dem = new Float32Array(d.length); for (let i = 0; i < d.length; i++) { v += d[i]; G.dem[i] = v; }
  const r = dec(GEO.roads); G.roads = []; let k = 1;
  for (let n = 0; n < r[0]; n++) { const cls = r[k++], lanes = r[k++], ow = r[k++], nm = GEO.roadNames[r[k++]], m = r[k++], pts = [], lv = []; let x = 0, z = 0; for (let i = 0; i < m; i++) { x += r[k++]; z += r[k++]; pts.push([x, z]); lv.push(r[k++]); } G.roads.push({ cls, lanes, ow, nm, pts, lv }); }
}

/*@@PRESETS@@*/

/* ═════════════ 10. BOOT / LOOP ═════════════ */
let composer = null, scenePass = null;
/* only the scene itself is multisampled; bloom and output run on plain half-float targets */
class ScenePass extends Pass {

    this.fsq = new FullScreenQuad(new THREE.ShaderMaterial({ uniforms: { t: { value: null } }, depthTest: false, depthWrite: false, vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}', fragmentShader: 'uniform sampler2D t;varying vec2 vUv;void main(){gl_FragColor=texture2D(t,vUv);}' })); }

  render(r, writeBuffer, readBuffer) { if (!this.samples) { r.setRenderTarget(readBuffer); r.clear(); r.render(scene, camera); return; }

let forced = null, drs = 1, drsUp = 0;
function resize() {

}
addEventListener('resize', resize);
function setQuality(i, manual) { qi = clamp(i, 0, 2); Q = QUALS[qi]; U.uDetail.value = Q.detail; document.getElementById('bQ').textContent = Q.name; if (manual) { drs = 1; drsUp = 0; } resize(); }
let autoQ = true;
function togglePhoto() { document.body.classList.toggle('photo'); }

const ST = { t: 0, frame: 0, fps: 60, paused: false, ft: [], traffic: .7 };
const hooks = [], _sz = new THREE.Vector2();   // per-frame updaters added by later sections
function frame(dt) {
  ST.t += dt; U.uTime.value = ST.t; renderer.info.reset();
  stepLight(dt); stepCamera(dt);
  for (const h of hooks) h(dt);
  selectTerrain();
  skyMesh.position.copy(camera.position);
  waterMesh.position.set(Math.round(camera.position.x / 1000) * 1000, 0, Math.round(camera.position.z / 1000) * 1000);
  const fl = _v.set(cam.tx, cam.tyS, cam.tz).clone(); updateShadows(fl, cam.dist * .9 + 120);
  composer.render();
  ST.frame++;
}
let lastT = 0, slowAcc = 0, fastAcc = 0, fpsAcc = 0, fpsN = 0;

function boot() {

  finalizeTerrain(); T.ctx = performance.now() - t0;
