<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hong Kong Island — Golden Hour</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#5b7fa6,#d9a878 62%,#27506a 63%,#123448);
    -webkit-user-select:none;user-select:none;font-family:"Avenir Next Condensed","DIN Condensed","Helvetica Neue",Arial,sans-serif}
  canvas#c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}

  body.photo canvas#c{cursor:none}
  #ui{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px 10px;
    background:rgba(9,20,28,.58);border:1px solid rgba(255,196,128,.28);border-radius:9px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#f3d9b4;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.62;transition:opacity .5s;
    max-width:calc(100vw - 16px);box-sizing:border-box}

  #pm u{width:7px;height:7px;border-radius:50%;background:#ffc98a;box-shadow:0 0 0 2px rgba(9,20,28,.6),0 0 10px rgba(255,190,110,.9)}

  #pm.on b,.lb.hit b,.lb.hit em{pointer-events:auto}
  #ui .g{display:flex;gap:3px;align-items:center}
  #ui .g+.g{padding-left:10px;border-left:1px solid rgba(255,196,128,.22)}

  #ui button.on{background:rgba(255,176,84,.36);color:#fff4df;border-color:rgba(255,206,140,.6)}

  #ui input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#ffc98a;border:1px solid #5a3a12;cursor:pointer}
  #ui #sTime{width:96px}
  #ui #oTime{min-width:34px;text-align:left;font-variant-numeric:tabular-nums}
  #bMenu{display:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lb{position:absolute;left:0;top:0;display:none;flex-direction:column;align-items:center;cursor:pointer;will-change:transform,opacity;color:#fff4df;text-shadow:0 1px 3px rgba(0,0,0,.85);white-space:nowrap}
  .lb b{font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;background:rgba(9,20,28,.5);border:1px solid rgba(255,206,140,.35);border-radius:3px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .lb em{font-style:normal;font-size:9px;letter-spacing:.06em;opacity:.85;margin-top:1px}
  .lb i{width:1px;height:16px;background:linear-gradient(rgba(255,206,140,.8),rgba(255,206,140,.1))}
  .lb.peak b{background:rgba(16,34,18,.5);border-color:rgba(180,230,160,.42)}
  .lb.tower b{background:rgba(9,20,40,.5);border-color:rgba(160,200,255,.42);font-size:9.5px;letter-spacing:.1em}
  .lb:hover b{background:rgba(255,176,84,.36)}
  body.photo #labels{display:none}
  #fc{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:none;flex-direction:column;gap:7px;padding:9px 11px 10px;
    width:max-content;max-width:min(320px,calc(100vw - 24px));box-sizing:border-box;background:rgba(9,20,28,.66);border:1px solid rgba(160,200,255,.36);border-radius:9px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#f3e6d0;font-size:11px;letter-spacing:.04em;line-height:1.35}
  #fc.show{display:flex}
  #fc h3{margin:0;padding-right:22px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff4df;font-weight:600}
  #fc p{margin:0;opacity:.82}
  #fc .r{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  #fc button,#fc label{font:inherit;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#f3d9b4}
  #fc button{background:rgba(255,190,110,.07);border:1px solid rgba(255,196,128,.26);border-radius:4px;padding:3px 8px;cursor:pointer}
  #fc button:hover{background:rgba(255,190,110,.2)}
  #fc button.on{background:rgba(255,176,84,.36);color:#fff4df;border-color:rgba(255,206,140,.6)}
  #fc .x{position:absolute;right:5px;top:5px;border:0;background:none;padding:2px 6px;font-size:12px}
  #fc label{display:flex;align-items:center;gap:6px;margin-left:4px}
  #fc input[type=range]{-webkit-appearance:none;appearance:none;width:64px;height:2px;background:rgba(255,196,128,.45);border-radius:2px;outline:none}
  #fc input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#ffc98a;border:1px solid #5a3a12;cursor:pointer}
  #fc input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#ffc98a;border:1px solid #5a3a12;cursor:pointer}

  #fc.focused .foc{display:flex}
  #fc.focused .pre{display:none}
  body.photo #fc{display:none}
  #fc .yr{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ffc98a;opacity:.9;margin-top:-3px}
  #fc .fact{font-size:12px;line-height:1.4;color:#fff4df;opacity:.95}
  #fc:not(.hasf) .yr,#fc:not(.hasf) .fact{display:none}
  #fc #fcS{font-size:10px;opacity:.62}
  #fc .ltr{display:none;gap:6px}
  #fc.lt .ltr{display:flex}
  #fc .ltr button{min-width:38px;padding:2px 10px 4px;font-size:20px;font-weight:600;line-height:1}
  #fc #ltPlay{font-size:11px;padding:5px 9px}
  #fc #ltN{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:10.5px;letter-spacing:.1em;opacity:.8}
  #fc #ltBar{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:1px;background:rgba(255,190,110,.75);transform-origin:left;transform:scaleX(0)}
  #fc{touch-action:none}
  #nav{position:fixed;z-index:5;transform:translateZ(0);right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .5s}
  #cp{width:62px;height:62px;cursor:grab;touch-action:none;outline:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.45))}
  #cp.drag{cursor:grabbing}
  #cp svg{display:block;width:100%;height:100%;overflow:visible}
  #cp:hover .bz,#cp:focus-visible .bz{stroke:rgba(255,206,140,.75)}
  #cp text{font:600 8px "Avenir Next Condensed","DIN Condensed","Helvetica Neue",Arial,sans-serif;fill:#ffb27a;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  #zm{display:flex;flex-direction:column;border:1px solid rgba(255,196,128,.32);border-radius:8px;overflow:hidden;background:rgba(9,20,28,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #zm button{width:36px;height:32px;padding:0;border:0;background:none;color:#f3d9b4;font-family:inherit;font-size:19px;line-height:1;cursor:pointer;touch-action:manipulation}
  #zm button+button{border-top:1px solid rgba(255,196,128,.22)}
  #zm button:hover{background:rgba(255,190,110,.2)}
  body.photo #nav,body.photo #hint{opacity:0;pointer-events:none}
  #hint{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 50px);transform:translate(-50%,8px);box-sizing:border-box;max-width:calc(100vw - 32px);width:max-content;
    padding:7px 6px;border-radius:18px;background:rgba(9,20,28,.72);border:1px solid rgba(255,206,140,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#fff4df;font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.6;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
  #hint.show{opacity:1;transform:translate(-50%,0)}
  #hint span{display:inline-block;white-space:nowrap;margin:0 .75em}
  #bigDrive{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 2px);display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;
    border-radius:44px;border:1px solid rgba(255,214,160,.85);background:rgba(9,20,28,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff4df;font-family:inherit;cursor:pointer;
    box-shadow:0 6px 22px rgba(0,0,0,.45);transition:transform .2s,opacity .6s;touch-action:manipulation;text-align:left;opacity:0;pointer-events:none}
  #bigDrive.ready{opacity:1;pointer-events:auto}
  #bigDrive:hover{transform:translateY(-2px)}
  #bigDrive i{position:relative;flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffb054;color:#2a1606}
  #bigDrive i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,176,84,.75);animation:bdPulse 2.2s ease-out infinite}
  @keyframes bdPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  #bigDrive span{display:flex;flex-direction:column;line-height:1.15}
  #bigDrive b{font-size:20px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  #bigDrive em{font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
  body.driving #bigDrive,body.photo #bigDrive{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){#bigDrive i::after{animation:none;opacity:0}}
  #drv{display:none}
  body.driving #drv{display:block}
  body.driving #ui,body.driving #nav,body.driving #fc,body.driving #pm,body.driving #labels{display:none !important}
  body.driving canvas#c{cursor:crosshair}
  body.photo #drv{display:none}
  #dTop{position:fixed;z-index:6;left:0;right:0;top:max(10px,env(safe-area-inset-top));display:flex;align-items:flex-start;gap:10px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
  #dTop>*{pointer-events:auto}
  #drv button{font-family:inherit;color:#f3d9b4;background:rgba(9,20,28,.66);border:1px solid rgba(255,196,128,.36);border-radius:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation}
  #dExit{width:42px;height:42px;font-size:16px;padding:0;flex:none}
  #dInfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  #dSt{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 14px;border-radius:10px;background:rgba(9,20,28,.66);border:1px solid rgba(255,196,128,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#fff4df;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  #dNx{display:none;align-items:center;gap:8px;max-width:100%;padding:4px 12px 4px 8px;border-radius:18px;background:rgba(9,20,28,.55);color:#f3e6d0;font-size:11px;letter-spacing:.08em;white-space:nowrap}
  #dNx.show{display:flex}
  #dArr{display:inline-block;font-style:normal;font-size:20px;line-height:1;color:#ffc98a;transition:transform .25s}
  #dNx b{font-weight:600;font-variant-numeric:tabular-nums;color:#ffc98a}
  #dNx em{font-style:normal;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  #dSide{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
  #dSpdBox{min-width:66px;padding:4px 8px 5px;border-radius:10px;background:rgba(9,20,28,.66);border:1px solid rgba(255,196,128,.3);text-align:center;color:#fff4df;line-height:1}
  #dSpd{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  #dSpdBox small{font-size:9px;letter-spacing:.14em;opacity:.7}
  #dU{padding:8px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  #dU.hot{background:rgba(64,170,220,.6);border-color:rgba(160,225,255,.95);color:#fff;animation:dUhot 1s ease-in-out infinite alternate}
  @keyframes dUhot{to{box-shadow:0 0 0 6px rgba(120,205,255,.28)}}
  #dNavB{width:42px;height:42px;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
  #dNavB.on{background:rgba(64,170,220,.55);border-color:rgba(160,225,255,.9);color:#fff}
  #dGo{display:none;align-items:center;gap:7px;max-width:100%;padding:4px 12px;border-radius:16px;background:rgba(20,70,100,.72);border:1px solid rgba(140,215,255,.6);color:#e6f7ff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  #dGo.show{display:flex}
  #dGo i{font-style:normal;color:#7fdcff}
  #dGo em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
  #navP{display:none;position:fixed;z-index:8;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);flex-direction:column;
    background:rgba(9,20,28,.9);border:1px solid rgba(140,215,255,.45);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  body.navopen #navP{display:flex}
  #navP .nh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 16px;color:#e6f7ff;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  #navX{width:34px;height:34px;padding:0;font-size:14px}
  #navL{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
  #drv .nv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:9px;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(140,215,255,.15)}
  #drv .nv:hover{background:rgba(64,170,220,.25)}
  .nv b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff4df;font-weight:600}
  .nv em{font-style:normal;font-size:10px;letter-spacing:.06em;opacity:.7;white-space:nowrap}
  #drv .nv.stop{justify-content:center;background:rgba(200,70,50,.35);border-color:rgba(255,160,140,.5);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  body.garage #dNavB{visibility:hidden}
  #dCar{width:42px;height:42px;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
  /* the start screen: step 1 the vehicle, big in the middle of the view; step 2 where to start and how to drive; step 3 (self-driving) where to */
  #garage{display:none;position:fixed;z-index:7;inset:0;pointer-events:none}
  body.garage #garage{display:block}
  body.garage #cr{opacity:0;pointer-events:none}
  body.garage #dInfo,body.garage #dSide,body.garage #dCar,body.garage #dNavB{visibility:hidden}
  #garage .gp{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;padding:calc(max(12px,env(safe-area-inset-top)) + 58px) 16px max(20px,env(safe-area-inset-bottom))}

  #gA .gnm{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:560px}
  #gName{font-size:clamp(28px,7vw,46px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff4df;line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,.85)}
  #gBlurb{font-style:normal;font-size:clamp(13px,3.4vw,16px);color:#fff1da;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  #gDots{display:flex;gap:10px;margin:16px 0 18px}

  #drv .gbtn{padding:16px 64px;font-size:17px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;background:rgba(255,176,84,.95);color:#241405;border-color:rgba(255,224,176,.95);border-radius:30px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
  #garage .gcard{margin:auto 0;width:min(100%,640px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 16px 18px;border-radius:20px;background:rgba(9,20,28,.84);border:1px solid rgba(255,196,128,.32);box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overscroll-behavior:contain}

  .nvseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px}
  #drv .nvm{padding:10px 8px;border-radius:9px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

  .glist .nv b{font-size:14px}

  #drv #dAuto{display:none;padding:8px 10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
