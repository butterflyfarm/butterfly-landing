<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Klimt — The Golden Realm</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b98a2c;-webkit-user-select:none;user-select:none;
    font-family:"Cormorant Garamond","Hoefler Text","Baskerville","Palatino Linotype",Georgia,serif}
  canvas#c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  canvas#c.drag{cursor:grabbing}
  body.photo canvas#c{cursor:none}
  #ui{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;flex-direction:column;gap:5px;align-items:center;padding:6px 9px 7px;
    background:rgba(38,24,6,.56);border:1px solid rgba(255,214,120,.42);border-radius:10px;
    box-shadow:0 0 0 1px rgba(20,12,2,.5),0 6px 30px rgba(40,22,0,.35);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#f6dc9a;font-size:11px;letter-spacing:.07em;opacity:.5;transition:opacity .6s;max-width:calc(100vw - 20px);box-sizing:border-box}
  #ui:hover,#ui:focus-within{opacity:1}
  #ui.hid,body.photo #ui{opacity:0;pointer-events:none}
  #ui .row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
  #ui button,#ui select{font:inherit;letter-spacing:inherit;color:#f6dc9a;background:rgba(255,206,96,.08);
    border:1px solid rgba(255,214,120,.36);border-radius:5px;padding:2px 5px 3px;cursor:pointer;text-transform:uppercase;font-size:9.5px;letter-spacing:.04em}
  #ui button:hover,#ui select:hover{background:rgba(255,206,96,.22)}
  #ui button.on{background:rgba(255,206,96,.34);color:#fff3cf}
  #ui select option{color:#2a1a04}
  #ui label{display:flex;align-items:center;gap:5px;text-transform:uppercase;font-size:9.5px;white-space:nowrap}
  #ui .sep{width:1px;height:16px;background:rgba(255,214,120,.3);margin:0 2px}
  #ui input[type=range]{-webkit-appearance:none;appearance:none;width:66px;height:2px;background:rgba(255,214,120,.45);border-radius:2px;outline:none}
  #ui input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#ffd978;border:1px solid #6b4a10;cursor:pointer}
  #ui input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#ffd978;border:1px solid #6b4a10;cursor:pointer}
  @media (max-width:520px){#ui input[type=range]{width:48px}#ui button,#ui select{padding:2px 5px 3px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="hid">
  <div class="row">
    <button data-p="0">Kiss</button><button data-p="1">Hem</button><button data-p="2">Profile</button>
    <button data-p="3">Cliff</button><button data-p="4">Tree</button><button data-p="5">Drift</button>
    <span class="sep"></span>
    <button id="bReset">Reset</button><button id="bMode">Orbit</button><button id="bPhoto">Photo</button>
  </div>
  <div class="row">
    <label>Light<input id="sLight" type="range" min="0" max="1" step="0.001" value="0.08"></label>
    <label>Gold leaf<input id="sLeaf" type="range" min="0" max="1" step="0.01" value="0.75"></label>
    <label>Growth<input id="sTree" type="range" min="0" max="8" step="0.05" value="1"></label>
    <select id="sQ"><option value="3">Ultra</option><option value="2" selected>High</option><option value="1">Medium</option><option value="0">Low</option></select>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ───────────── utils ───────────── */
const TAU = Math.PI * 2, PI = Math.PI, RAD = PI / 180;
const V3 = THREE.Vector3;
const v3 = (x = 0, y = 0, z = 0) => new V3(x, y, z);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(1908);
const rr = (a, b) => a + (b - a) * rnd();
/* smoothed piecewise-linear profile */
function K(keys) {
  const lin = v => { if (v <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (v <= keys[i][0]) { const a = keys[i - 1], b = keys[i]; return a[1] + (b[1] - a[1]) * (v - a[0]) / (b[0] - a[0]); } return keys[keys.length - 1][1]; };
  const d = .035; return v => (lin(v - d) + 2 * lin(v) + lin(v + d)) * .25;
}
const HASH = location.hash || '';
const STILL = HASH.includes('still');

/* ───────────── renderer ───────────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x8a5c12, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(16, 1, 0.25, 16000);
camera.rotation.order = 'YXZ';

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 0 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.34, 0.5, 1.1);
composer.addPass(bloom);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.34 }, uSeed: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig; uniform float uSeed; varying vec2 vUv;
    void main(){
      vec3 c = max(texture2D(tDiffuse, vUv).rgb, 0.);
      float l = max(dot(c, vec3(.2126,.7152,.0722)), 1e-5);
      float a = .72; float lt = l < a ? l : a + (1.-a)*(1.-exp(-(l-a)/(1.-a)));
      c *= lt/l;
      c = mix(c, vec3(1.,.97,.88)*lt, smoothstep(1.2, 5., l)*.75);
      vec2 q = vUv-.5; float v = dot(q,q)*2.;
      c *= 1. - uVig*v*v*1.6;
      c = pow(clamp(c,0.,1.), vec3(1./2.2));
      float n = fract(sin(dot(gl_FragCoord.xy + uSeed, vec2(12.9898,78.233)))*43758.5453);
      c += (n-.5)/255.;
      gl_FragColor = vec4(c,1.);
    }`
});
composer.addPass(finalPass);

/* ───────────── shared uniforms + GLSL ───────────── */
const U = {
  uTime: { value: 0 }, uSunDir: { value: v3(.3, .8, .5).normalize() }, uSunCol: { value: new THREE.Color(1, .93, .74) },
  uAtmoTop: { value: new THREE.Color() }, uAtmoMid: { value: new THREE.Color() }, uAtmoLow: { value: new THREE.Color() },
  uFogDensity: { value: 1 / 2600 }, uHoney: { value: 0 }, uPix: { value: .001 },
  uTa: { value: 0 }, uTb: { value: 0 }, uTree: { value: 0 },
};
const COMMON = /* glsl */`
uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uAtmoTop; uniform vec3 uAtmoMid; uniform vec3 uAtmoLow;
uniform float uFogDensity; uniform float uHoney; uniform float uPix;
#define TAU 6.2831853
#define S(r,g,b) pow(vec3(r,g,b)/255., vec3(2.2))
float hash11(float n){ return fract(sin(n*127.1+311.7)*43758.5453); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 hash32(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yzz)*p3.zyx); }
float hash13(vec3 p3){ p3=fract(p3*.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),f.x), mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),f.x), f.y); }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),f.x), mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),f.x), f.y),
             mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),f.x), mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),f.x), f.y), f.z); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
float windWave(vec2 x, float t){ float w = sin(dot(x, vec2(.042,.021)) - t*.32 + 2.4*vnoise(x*.011 + t*.013)); w=w*.5+.5; return w*w*(3.-2.*w); }
vec3 atmo(vec3 d){
  vec3 c = mix(uAtmoMid, uAtmoTop, smoothstep(0., 1., d.y));
  c = mix(c, uAtmoLow, smoothstep(0., -1., d.y));
  float s = max(dot(d, uSunDir), 0.);
  c += uSunCol*uAtmoTop*(.22*s*s*s + .35*pow(s, 24.));
  return c;
}
vec3 fogged(vec3 col, vec3 wp, float k){
  vec3 v = wp - cameraPosition; float d = length(v);
  float f = 1. - exp(-d*uFogDensity*k);
  return mix(col, atmo(v/d), f);
}
vec3 fpal(float h){
  if(h<.2) return S(53.,88.,168.); if(h<.36) return S(122.,79.,163.); if(h<.54) return S(242.,236.,220.);
  if(h<.7) return S(240.,196.,54.); if(h<.82) return S(200.,57.,43.); if(h<.92) return S(233.,163.,180.); return S(230.,138.,46.);
}
`;
function mat(vs, fs, uniforms = {}, opts = {}) {
  return new THREE.ShaderMaterial(Object.assign({ uniforms: Object.assign({}, U, uniforms), vertexShader: COMMON + vs, fragmentShader: COMMON + fs }, opts));
}
function instGeo(extra) {
  const base = new THREE.PlaneGeometry(1, 1);
  const g = new THREE.InstancedBufferGeometry();
  g.index = base.index; g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
  for (const k in extra) g.setAttribute(k, new THREE.InstancedBufferAttribute(extra[k][0], extra[k][1]));
  return g;
}

/* ───────────── the gold atmosphere (no sky, no horizon) ───────────── */
const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 32), mat(/* glsl */`
  varying vec3 vDir;
  void main(){ vDir = position; vec4 p = projectionMatrix*viewMatrix*vec4(position + cameraPosition, 1.); gl_Position = vec4(p.xy, p.w*.999999, p.w); }`, /* glsl */`
  varying vec3 vDir;
  float fbm3(vec3 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*vnoise3(p); p=p*2.02+vec3(13.1,7.7,3.3); a*=.5; } return s*1.143; }
  float dustLayer(vec3 d, float sc, float t, float seed, float rad, float rare){
    vec3 p = d*sc + vec3(seed, seed*1.7 + t*.04, seed*.3);
    vec3 id = floor(p); vec3 f = fract(p)-.5; float r = hash13(id+seed);
    vec3 o = vec3(hash13(id+7.1), hash13(id+3.3), hash13(id+9.7))-.5;
    float dd = length(f - o*.5);
    float tw = .55+.45*sin(t*(.4+r*1.3)+r*40.);
    return step(rare, r)*smoothstep(rad, rad*.25, dd)*tw;
  }
  void main(){
    vec3 d = normalize(vDir); float t = uTime;
    vec3 c = atmo(d);
    float m = fbm3(d*1.5 + vec3(t*.004, -t*.003, t*.002));
    float m2 = .6*vnoise3(d*4.3 + vec3(-t*.006, t*.002, t*.005)) + .4*vnoise3(d*9.1 + vec3(t*.004, -t*.005, t*.003));
    vec3 q = d*vec3(2.1,5.2,2.1); q.x += .6*sin(d.y*3.+t*.02); q.z += .5*cos(d.x*2.6-t*.015);
    float cur = fbm3(q + vec3(t*.012, t*.004, -t*.009));
    float stream = smoothstep(.5,.76,cur);
    c *= .78 + .30*m + .18*m2;
    c += (uAtmoTop*.5 + uSunCol*uAtmoTop*.25)*stream*(.45+.55*m);
    // gold dust, held at a constant apparent size whatever the lens
    float fw = max(length(fwidth(d)), 1e-6);
    float lf = log2(.1/fw); float l0 = floor(lf); float fr = lf-l0;
    float sA = exp2(l0), sB = sA*2.;
    float dust = mix(dustLayer(d, sA, t, 3.1, .17, .84), dustLayer(d, sB, t, 5.7, .17, .84), fr);
    dust += .8*mix(dustLayer(d, sA*.37, t, 11.3, .26, .93), dustLayer(d, sB*.37, t, 17.9, .26, .93), fr);
    c += vec3(1.,.80,.40)*dust*(.62 + .8*stream + .35*m)*mix(1.,.7,uHoney);
    gl_FragColor = vec4(c,1.);
  }`, {}, { side: THREE.BackSide, depthWrite: false }));
sky.frustumCulled = false; sky.renderOrder = 1000; scene.add(sky);

/* ───────────── the meadow cliff ───────────── */
const ISL = { cx: -150, cz: 50, a: 164.5, b: 320, n: 6 };
function islandR(phi) {
  const c = Math.abs(Math.cos(phi)), s = Math.abs(Math.sin(phi));
  const r = Math.pow(Math.pow(c / ISL.a, ISL.n) + Math.pow(s / ISL.b, ISL.n), -1 / ISL.n);
  return r * (1 + .010 * Math.sin(phi * 9 + 1.3) + .006 * Math.sin(phi * 17 + .4));
}
function islandFrac(x, z) { const dx = x - ISL.cx, dz = z - ISL.cz; return Math.hypot(dx, dz) / islandR(Math.atan2(dz, dx)); }
function terrainH(x, z) {
  const f = islandFrac(x, z); if (f >= 1) return 0;
  const edge = sstep(0, 30, (1 - f) * 200);
  const flat = sstep(15, 42, Math.hypot(x, z));
  const m = 9 * Math.exp(-(((x + 48) / 95) ** 2 + ((z + 78) / 62) ** 2)) + 4 * Math.exp(-(((x + 150) / 120) ** 2 + ((z - 120) / 140) ** 2))
    + .6 * Math.sin(x * .05 + 1) * Math.sin(z * .043);
  return m * flat * edge;
}
{
  const RINGS = 80, SEGS = 440;
  const pos = new Float32Array((RINGS + 1) * (SEGS + 1) * 3), idx = [];
  for (let i = 0; i <= RINGS; i++) for (let j = 0; j <= SEGS; j++) {
    const phi = j / SEGS * TAU, f = i / RINGS, r = islandR(phi) * f;
    const x = ISL.cx + Math.cos(phi) * r, z = ISL.cz + Math.sin(phi) * r, o = (i * (SEGS + 1) + j) * 3;
    pos[o] = x; pos[o + 1] = terrainH(x, z); pos[o + 2] = z;
  }
  for (let i = 0; i < RINGS; i++) for (let j = 0; j < SEGS; j++) {
    const a = i * (SEGS + 1) + j, b = a + SEGS + 1, c = a + 1, d = b + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
  const ground = new THREE.Mesh(g, mat(/* glsl */`
    varying vec3 vWp; void main(){ vWp = position; gl_Position = projectionMatrix*viewMatrix*vec4(position,1.); }`, /* glsl */`
    varying vec3 vWp;
    void main(){
      vec2 x = vWp.xz; float fp = max(length(dFdx(x)), length(dFdy(x)));
      const float sc = 1.7; vec2 g = x/sc; vec2 ig = floor(g), fg = fract(g);
      float d1 = 9., d2 = 9.; vec2 cid = ig; vec2 cdv = vec2(0.);
      for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 o = vec2(float(i),float(j)); vec2 dv = o + hash22(ig+o) - fg; float d = dot(dv,dv);
        if(d<d1){ d2=d1; d1=d; cid=ig+o; cdv=dv; } else if(d<d2) d2=d; }
      d1 = sqrt(d1); d2 = sqrt(d2);
      vec3 r = hash32(cid+3.);
      vec3 col = mix(S(36.,88.,46.), S(104.,152.,60.), r.x);
      col = mix(col, S(30.,74.,66.), step(.78, r.y));
      if(r.z < .46){
        float rr = d1/.44; float ang = atan(cdv.y, cdv.x); float n = 6.+floor(r.x*6.);
        float pet = .6+.32*abs(cos(ang*n*.5));
        col = mix(col, fpal(fract(r.z*17.3)), smoothstep(pet+.06, pet-.03, rr));
        col = mix(col, S(240.,200.,70.), smoothstep(.25,.18,rr));
      }
      col *= mix(.5, 1., smoothstep(.0,.08,d2-d1));
      vec3 avg = S(74.,120.,62.)*.95 + fpal(fract(vnoise(x*.05)*3.))*.10;
      col = mix(col, avg, smoothstep(.5, 2.6, fp/sc));
      float w = windWave(x, uTime);
      col *= .76 + .52*w;
      col *= uSunCol*(.52 + .5*max(uSunDir.y,0.)) + uAtmoTop*.22;
      gl_FragColor = vec4(fogged(col, vWp, 1.), 1.);
    }`));
  ground.frustumCulled = false; scene.add(ground);

  // the clean break: a wall that falls away into the void
  const depths = [0, 5, 16, 44, 100, 190, 330];
  const wp = new Float32Array((SEGS + 1) * depths.length * 3), wuv = new Float32Array((SEGS + 1) * depths.length * 2), widx = [];
  let arc = 0, px = 0, pz = 0;
  for (let j = 0; j <= SEGS; j++) {
    const phi = j / SEGS * TAU, r = islandR(phi);
    const ex = Math.cos(phi) * r, ez = Math.sin(phi) * r;
    if (j > 0) arc += Math.hypot(ex - px, ez - pz); px = ex; pz = ez;
    depths.forEach((d, k) => {
      const s = 1 - .0007 * d - .03 * sstep(0, 70, d) + .012 * Math.sin(phi * 23 + d * .05) * sstep(0, 20, d);
      const o = j * depths.length + k;
      wp[o * 3] = ISL.cx + ex * s; wp[o * 3 + 1] = -d; wp[o * 3 + 2] = ISL.cz + ez * s;
      wuv[o * 2] = arc; wuv[o * 2 + 1] = d;
    });
  }
  for (let j = 0; j < SEGS; j++) for (let k = 0; k < depths.length - 1; k++) {
    const a = j * depths.length + k, b = a + depths.length; widx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.BufferAttribute(wp, 3)); wg.setAttribute('uv', new THREE.BufferAttribute(wuv, 2)); wg.setIndex(widx);
  wg.computeVertexNormals();
  const wall = new THREE.Mesh(wg, mat(/* glsl */`
    varying vec3 vWp; varying vec2 vUv; varying vec3 vN;
    void main(){ vWp = position; vUv = uv; vN = normal; gl_Position = projectionMatrix*viewMatrix*vec4(position,1.); }`, /* glsl */`
    varying vec3 vWp; varying vec2 vUv; varying vec3 vN;
    void main(){
      float d = vUv.y; vec2 q = vUv;
      float band = floor(d/5. + .8*vnoise(vec2(q.x*.02, 3.)));
      vec3 r = hash32(vec2(band, 7.));
      vec3 base = mix(S(132.,90.,30.), S(74.,46.,16.), r.x);
      vec2 cell = vec2(q.x/(1.6+2.6*r.y) + r.z*10., d/1.8); vec2 id = floor(cell); vec2 f = fract(cell);
      float h = hash12(id + band*3.1);
      vec3 col = base*(.8+.4*h);
      col = mix(col, S(214.,165.,60.), step(.9,h));
      col = mix(col, S(20.,16.,12.), step(h,.06));
      col *= .55 + .45*smoothstep(0.,.07,min(min(f.x,1.-f.x),min(f.y,1.-f.y)));
      float vine = smoothstep(.62,.8, vnoise(vec2(q.x*.4, d*.05)))*smoothstep(46., 2., d);
      col = mix(col, mix(S(44.,96.,50.), S(96.,150.,60.), vnoise(q*vec2(1.3,.4))), vine*.85);
      col = mix(col, S(62.,116.,56.), smoothstep(1.4,0.,d));
      vec3 N = normalize(vN); if(!gl_FrontFacing) N = -N;
      col *= uSunCol*(.42 + .5*(dot(N,uSunDir)*.5+.5)) + uAtmoMid*.3;
      vec3 v = vWp - cameraPosition;
      col = fogged(col, vWp, 1.);
      col = mix(col, atmo(normalize(v)), smoothstep(10., 170., d)*.99);
      gl_FragColor = vec4(col, 1.);
    }`, {}, { side: THREE.DoubleSide }));
  wall.frustumCulled = false; scene.add(wall);
}

/* ───────────── the colossus: three nested robes ───────────── */
const ROBES = {

$('bMode').addEventListener('click', () => setMode(cam.mode === 'orbit' ? 'fly' : 'orbit'));
$('bPhoto').addEventListener('click', () => setPhoto(true));
$('sLight').addEventListener('input', e => { cyc = +e.target.value; });
$('sLight').addEventListener('pointerdown', () => lightDrag = true); addEventListener('pointerup', () => lightDrag = false);
$('sLeaf').addEventListener('input', e => { leaf = +e.target.value; applyLeaf(); });
$('sTree').addEventListener('input', e => { treeSpeed = +e.target.value; });
$('sQ').addEventListener('change', e => { qi = +e.target.value; dbg.autoQuality = false; applyQuality(); });
addEventListener('resize', resize);

/* ───────────── loop ───────────── */
const dbg = window.__klimt = { cam, camera, U, renderer, scene, pause: false, autoQuality: !STILL, fps: 60, frameMs: 16, preset, setPose: (p, t, f) => { setPose({ pos: v3(...p), target: v3(...t), fov: f }); cam.atPainting = false; },
  setMode, setPhoto, renderAt: (w, h, r) => { pr = r; renderer.setPixelRatio(r); renderer.setSize(w, h, false); composer.setPixelRatio(r); composer.setSize(w, h); if (r > 1.25) bloom.setSize(w * r * .5, h * r * .5); }, still: () => { intro = 'done'; dbg.autoQuality = false; preset(0, true); }, counts: () => ({ facets: facets.userData.max, flowers: meadow.userData.max, treeRings: treePool.rings, twigSites: twigSites.length, perches: perches.length, treePlanEnd }),
  get time() { return time; }, set time(v) { time = v; }, get tree() { return treeTime; }, set tree(v) { treeTime = v; }, get cyc() { return cyc; }, set cyc(v) { cyc = v; }, get quality() { return qi; } };
let time = 0, treeTime = 430, last = performance.now(), lowT = 0, frameN = 0;
renderer.info.autoReset = false;
setLight(); preset(0, true); applyQuality();
if (COARSE) setMode('orbit');
if (STILL) $('ui').classList.remove('hid');
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now; const dt = dbg.pause ? 0 : Math.min(raw, .05);
  dbg.frameMs = lerp(dbg.frameMs, raw * 1000, .05); dbg.fps = 1000 / dbg.frameMs;
  time += dt; U.uTime.value = time;
  const al = .5 + .5 * Math.sin(time * .05); U.uTa.value += (1 - al) * dt; U.uTb.value += al * dt;
  treeTime += dt * treeSpeed; U.uTree.value = treeTime;
  if (!lightDrag) cyc = (cyc + dt / 300) % 1;
  setLight();
  if ((frameN++ & 15) === 0 && !lightDrag) $('sLight').value = cyc;
  updateTendrils(time); updateTwigs(treeTime); updateBanners(time); updateCamera(dt, time);
  U.uPix.value = 2 * Math.tan(camera.fov * RAD / 2) / (innerHeight * pr);
  finalPass.uniforms.uSeed.value = (time * 61) % 997;
  renderer.info.reset();
  composer.render();
  if (dbg.autoQuality && time > 8 && document.visibilityState === 'visible') {
    lowT = dbg.fps < 33 ? lowT + raw : Math.max(0, lowT - raw * 2);
    if (lowT > 4 && qi > 0) { qi--; lowT = 0; applyQuality(); }
  }
}
requestAnimationFrame(frame);
</script>
